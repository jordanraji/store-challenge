name: Architecture diagrams

on:
  push:
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render C4 diagrams
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" -w /workspace \
            ghcr.io/plantuml/plantuml:1.2026.9 \
            -tsvg -failfast2 -o generated docs/architecture/store.puml
          test -s docs/architecture/generated/c4-context.svg
          test -s docs/architecture/generated/c4-containers.svg
          test -s docs/architecture/generated/c4-components.svg
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams
          path: docs/architecture/generated/*.svg
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: architecture-diagrams
          path: docs/architecture/generated
      - name: Commit updated diagrams
        run: |
          git add docs/architecture/generated/c4-context.svg docs/architecture/generated/c4-containers.svg docs/architecture/generated/c4-components.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate C4 architecture diagrams'
          git push origin "HEAD:$GITHUB_REF_NAME"
