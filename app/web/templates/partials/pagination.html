{% set base = '/admin' if request.url.path.startswith('/admin') else '/' %}
{% if total > page_size %}<nav class="product-pagination d-flex align-items-center justify-content-between gap-3" aria-label="Product pages">{% if page > 1 %}<a class="btn btn-outline-secondary" href="{{ base }}?q={{ q|urlencode }}&category={{ category|urlencode }}&page={{ page-1 }}">Previous</a>{% else %}<span></span>{% endif %}<span>Page {{ page }} of {{ ((total - 1) // page_size) + 1 }}</span>{% if page * page_size < total %}<a class="btn btn-outline-secondary" href="{{ base }}?q={{ q|urlencode }}&category={{ category|urlencode }}&page={{ page+1 }}">Next</a>{% endif %}</nav>{% endif %}
